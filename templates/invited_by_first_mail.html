{% extends "base.html" %}

{% block title %}Приглашённые по дате{% endblock %}

{% block content %}
    <h2>Показать приглашённых по дате первого приглашения</h2>
    <form method="post">
        <label for="date">Дата первой рассылки:</label>
        <input type="date" id="date" name="date" required>
        <button type="submit">Показать список</button>
    </form>
{% endblock %}
