name: Security & Quality Scan

on:
  push:
    branches: [ dev, prod ]
  pull_request:
    branches: [ dev, prod ]

jobs:
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  code-quality:
    name: Python Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Show problematic line
        run: |
          echo "=== Checking debug line ==="
          grep -n "debug=True" app.py || echo "debug=True not found"
          echo "=== Bandit config ==="
          cat .bandit.yml || echo "No bandit config"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install flake8 bandit

      - name: Lint with flake8
        run: |
          flake8 .

      - name: Security scan with Bandit (STRICT MODE)
        run: |
          bandit -r . -f txt  

  infrastructure-scan:
    name: Infrastructure Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Lint Kubernetes manifests
        run: |
          docker run --rm -v $(pwd):/dir stackrox/kube-linter lint /dir/kubernetes/
